name: Build EchoClient

on:
  push:
    branches: [main]
    paths: ['echo/**', '.github/workflows/build-echo.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon --dependency-verification=lenient
      - name: Collect jar
        id: jar
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          JAR=$(ls build/libs/*.jar | grep -v -- '-dev.jar' | grep -v -- '-sources.jar' | head -1)
          cp "$JAR" "dist/EchoClient-${VERSION}-android.jar"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: echo-client-jar
          path: echo/dist/*.jar
      - name: Draft release (private until you publish it)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: echo-v${{ steps.jar.outputs.version }}-build-${{ github.run_number }}
          name: EchoClient v${{ steps.jar.outputs.version }} - Zalith Android Edition (build ${{ github.run_number }})
          draft: true
          files: echo/dist/EchoClient-${{ steps.jar.outputs.version }}-android.jar
          body: |
            EchoClient ${{ steps.jar.outputs.version }} for Minecraft 1.21.11 (Fabric, Java 21), Zalith Android edition.

            How to use: put the jar in your instance's mods folder with Fabric API 0.141.6+1.21.11.
