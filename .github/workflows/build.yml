name: Build CorzClient

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
      - name: Collect remapped jar
        id: jar
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          JAR=$(ls build/libs/*.jar | grep -v -- '-dev.jar' | grep -v -- '-sources.jar' | head -1)
          cp "$JAR" "dist/corz-client-${VERSION}.jar"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: corz-client-jar
          path: dist/*.jar
      - name: Draft release with jar (private until you publish it)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.jar.outputs.version }}-build-${{ github.run_number }}
          name: CorzClient v${{ steps.jar.outputs.version }} - Zalith Android Edition (build ${{ github.run_number }})
          draft: true
          files: dist/corz-client-${{ steps.jar.outputs.version }}.jar
          body: |
            CorzClient ${{ steps.jar.outputs.version }} for Minecraft 1.21.11 (Fabric, Java 21), Zalith Android edition.

            How to use: put the jar in your instance's mods folder with Fabric API 0.141.6+1.21.11.
